<!doctype html>
<html lang="vi">
<head>
    <title>Ví dụ Bootstrap 5</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-3">
    <div class="container-fluid">
        <div class="row g-3">
            <!-- Sidebar -->
            <div class="col-lg-2">
                <div class="bg-white p-3 rounded shadow-sm h-100">
                    <h1 class="text-primary text-center h3 mb-3">LOGO</h1>
                    <div class="list-group">
                        <a href="#" class="list-group-item list-group-item-action active">Dashboard</a>
                        <a href="#" class="list-group-item list-group-item-action">Age</a>
                        <a href="#" class="list-group-item list-group-item-action">Gender</a>
                        <a href="#" class="list-group-item list-group-item-action">Geo</a>
                    </div>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-lg-10">
                <div class="row g-3">
                    <!-- Top Card -->
                    <div class="col-12">
                        <div class="bg-white p-3 rounded shadow-sm">
                            <h5 class="mb-1">Dashboard</h5>
                            <p class="text-muted mb-0">Some text</p>
                        </div>
                    </div>

                    <!-- Metrics -->
                    <div class="col-sm-6 col-lg-3">
                        <div class="bg-white p-3 rounded shadow-sm">User<br><strong>1 Million</strong></div>
                    </div>
                    <div class="col-sm-6 col-lg-3">
                        <div class="bg-white p-3 rounded shadow-sm">Pages<br><strong>100 Million</strong></div>
                    </div>
                    <div class="col-sm-6 col-lg-3">
                        <div class="bg-white p-3 rounded shadow-sm">Sessions<br><strong>10 Million</strong></div>
                    </div>
                    <div class="col-sm-6 col-lg-3">
                        <div class="bg-white p-3 rounded shadow-sm">Bounce<br><strong>30%</strong></div>
                    </div>

                    <!-- 3 Column Row -->
                    <div class="col-md-4">
                        <div class="bg-white p-3 rounded shadow-sm">Text<br>Text<br>Text</div>
                    </div>
                    <div class="col-md-4">
                        <div class="bg-white p-3 rounded shadow-sm">Text<br>Text<br>Text</div>
                    </div>
                    <div class="col-md-4">
                        <div class="bg-white p-3 rounded shadow-sm">Text<br>Text<br>Text</div>
                    </div>

                    <!-- 2 Column Row -->
                    <div class="col-md-6">
                        <div class="bg-white p-3 rounded shadow-sm">Text</div>
                    </div>
                    <div class="col-md-6">
                        <div class="bg-white p-3 rounded shadow-sm">Text</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
