<!doctype html>
<html lang="vi" data-bs-theme="light">
    <head>
        <title>Xác thực biểu mẫu</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
    </head>

    <body>
        <header>
            <!-- place navbar here -->
        </header>

        <main>
            <div class="container mt-3">
                <p>a,</p>
                <h1>Xác thực biểu mẫu</h1>
                <p>Ví dụ bạn gửi biểu mẫu nhưng chưa điền hết thông tin thì sẽ nhận được thông báo lỗi.</p>
                
                <form>
                    <div class="mb-3">
                        <label for="username" class="form-label">Tên người dùng</label>
                        <input
                            type="text"
                            class="form-control"
                            id="username"
                            placeholder="Nhập tên người dùng"
                            required
                        />
                        <div class="form-text">Điền đầy đủ thông tin</div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Mật khẩu</label>
                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            placeholder="Enter password"
                            required
                        />
                        <div class="form-text">Điền đầy đủ thông tin</div>
                    </div>

                    <div class="mb-3 form-check">
                        <input class="form-check-input" type="checkbox" id="agree" required />
                        <label class="form-check-label" for="agree">Đồng ý</label>
                    </div>

                    <button type="submit" class="btn btn-primary">Đăng nhập</button>
                </form>
            </div>


            <div class="container mt-3">
                <p>b,</p>
                <h1>Registration Form</h1>
                
                <form>
                    <div class="row mb-3">
                        <label for="firstName" class="col-sm-3 col-form-label">First Name:</label>
                        <div class="col-sm-9">
                            <input
                                type="text"
                                class="form-control"
                                id="firstName"
                                placeholder="Enter first name"
                            />
                        </div>
                    </div>

                    <div class="row mb-3">
                        <label for="lastName" class="col-sm-3 col-form-label">Last Name:</label>
                        <div class="col-sm-9">
                            <input
                                type="text"
                                class="form-control"
                                id="lastName"
                                placeholder="Enter last name"
                            />
                        </div>
                    </div>

                    <div class="row mb-3">
                        <label for="email" class="col-sm-3 col-form-label">Email:</label>
                        <div class="col-sm-9">
                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                placeholder="abc@mail.com"
                            />
                        </div>
                    </div>

                    <div class="row mb-3">
                        <label for="mobile" class="col-sm-3 col-form-label">Mobile Number:</label>
                        <div class="col-sm-9">
                            <input
                                type="tel"
                                class="form-control"
                                id="mobile"
                                placeholder="Enter mobile number"
                            />
                        </div>
                    </div>

                    <div class="row mb-3">
                        <label for="dob" class="col-sm-3 col-form-label">Date of Birth:</label>
                        <div class="col-sm-9">
                            <input
                                type="date"
                                class="form-control"
                                id="dob"
                            />
                        </div>
                    </div>

                    <div class="row mb-3">
                        <label for="address" class="col-sm-3 col-form-label">Postal Address:</label>
                        <div class="col-sm-9">
                            <textarea class="form-control" id="address" rows="3"></textarea>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <label for="zip" class="col-sm-3 col-form-label">Zip Code:</label>
                        <div class="col-sm-9">
                            <input
                                type="text"
                                class="form-control"
                                id="zip"
                                placeholder="Enter zip code"
                            />
                        </div>
                    </div>

                    <div class="row mb-3">
                        <label for="uploadImage" class="col-sm-3 col-form-label">Upload Image:</label>
                        <div class="col-sm-9">
                            <input class="form-control" type="file" id="uploadImage">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <label class="col-sm-3 col-form-label">Gender:</label>
                        <div class="col-sm-9 d-flex align-items-center">
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="gender" id="male" value="male">
                                <label class="form-check-label" for="male">Male</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="gender" id="female" value="female">
                                <label class="form-check-label" for="female">Female</label>
                            </div>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-sm-9 offset-sm-3">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="terms">
                                <label class="form-check-label" for="terms">I agree to the Terms and Conditions</label>
                            </div>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-sm-9 offset-sm-3">
                            <button type="submit" class="btn btn-secondary me-2">Submit</button>
                            <button type="reset" class="btn btn-secondary">Reset</button>
                        </div>
                    </div>
                </form>
            </div>
        </main>

        <footer>
            <!-- place footer here -->
        </footer>

        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
