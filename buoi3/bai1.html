<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Title</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
    </head>

    <body>
        <header>
            <!-- place navbar here -->
        </header>
        <main>
            <div class="container mt-3">
            <p>a, định nghĩa các class buttons</p>
            <button type="button" class="btn btn-primary">primary</button>
            <button type="button" class="btn btn-secondary">secondary</button>
            <button type="button" class="btn btn-success">success</button>
            <button type="button" class="btn btn-danger">danger</button>
            <button type="button" class="btn btn-warning">warning</button>
            <button type="button" class="btn btn-info">info</button>
            <button type="button" class="btn btn-light">light</button>
            <button type="button" class="btn btn-dark">dark</button>
            <button type="button" class="btn btn-link">link</button>

            <p>b, button với đường viền</p>
            <button type="button" class="btn btn-outline-primary">primary</button>
            <button type="button" class="btn btn-outline-secondary">secondary</button>
            <button type="button" class="btn btn-outline-success">success</button>
            <button type="button" class="btn btn-outline-danger">danger</button>
            <button type="button" class="btn btn-outline-warning">warning</button>
            <button type="button" class="btn btn-outline-info">info</button>
            <button type="button" class="btn btn-outline-light">light</button>
            <button type="button" class="btn btn-outline-dark">dark</button>

            <p>c, kích thước của button</p>
            <button type="button" class="btn btn-primary btn-lg">large button</button>
            <button type="button" class="btn btn-primary btn-md">medium button</button>
            <button type="button" class="btn btn-primary btn-sm">small button</button>

            <p>d, thành phần của button</p>
            <a href="https://example.com" class="btn btn-primary">
            Button chứa link
            </a>
           <button type="button" class="btn btn-outline-primary">chinh</button>
           <button type="button" class="btn btn-outline-secondary">phu</button>
           <button type="button" class="btn btn-outline-success">thanh cong</button>
           <button type="button" class="btn btn-outline-danger">that bai</button>

            <p>e, trạng thái của button</p>
            <button type="button" class="btn btn-primary">button</button>
            <button type="button" class="btn btn-primary" disabled>disabled button</button>
            <a href="#" class="btn btn-primary disabled">disabled link</a>

            <p>f, nút đang load</p>
            <div class="container mt-3">
                <button class="btn btn-primary">
                    <span class="spinner-border"></span>
                </button>
                <button class="btn btn-primary">
                    <span class="spinner-border"></span>
                    loading
                </button>
                <button class="btn btn-primary" disabled>
                    <span class="spinner-border"></span>
                    loading
                </button>
                <button class="btn btn-primary" disabled>
                    <span class="spinner-grow spinner-grow-sm"></span>
                    loading
                </button>
            </div>
            </div>
        </main>
        <footer>
            <!-- place footer here -->
        </footer>
        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
