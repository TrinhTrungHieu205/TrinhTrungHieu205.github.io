<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Title</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
    </head>

    <body>
        <header>
            <!-- place navbar here -->
        </header>
        <main>
            <div class="mb-4">
                <p class="mb-2">Left alignment(This is default)</p>
                <div class="border p-2">
                    <img src="https://vnkings.com/wp-content/uploads/2019/08/nhung-cau-noi-hay-trong-5cm-s-17.jpg" class="rounded" alt="Left" width="304" height="236">
                </div>
            </div>
            <div class="mb-4">
                <p class="mb-2">Center alignment using text alignmenr class</p>
                <div class="border p-2 text-center">
                    <img src="https://vnkings.com/wp-content/uploads/2019/08/nhung-cau-noi-hay-trong-5cm-s-17.jpg" class="rounded" alt="Center" width="304" height="236">
                </div>
            </div>
            <div class="mb-4">
                <p class="mb-2">Right alignment using text alignmenr class</p>
                <div class="border p-2 text-end">
                    <img src="https://vnkings.com/wp-content/uploads/2019/08/nhung-cau-noi-hay-trong-5cm-s-17.jpg" class="rounded" alt="Right" width="304" height="236">
                </div>
            </div>


            <div class="mb-4">
                <p class="mb-2">Horizontal alignment using float classes</p>
                <div class="border p-2">
                    <img src="https://vnkings.com/wp-content/uploads/2019/08/nhung-cau-noi-hay-trong-5cm-s-17.jpg" class="rounded" alt="Left" width="304" height="236">
                    <img src="https://vnkings.com/wp-content/uploads/2019/08/nhung-cau-noi-hay-trong-5cm-s-17.jpg" class="rounded float-end" alt="Right" width="304" height="236">
                </div>
            </div>




            <div class="mb-4">
                <p class="mb-2">Center alignment of block-level image using auto margin</p>
                <div class="border p-2">
                    <img src="https://vnkings.com/wp-content/uploads/2019/08/nhung-cau-noi-hay-trong-5cm-s-17.jpg" class="rounded d-block mx-auto" alt="Center" width="304" height="236">
            </div>
        </main>
        <footer>
            <!-- place footer here -->
        </footer>
        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
